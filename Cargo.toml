[package]
name = "s3find"
authors = ["Andrii Radyk <ander.ender@gmail.com>"]
version = "0.16.1"
description = """
A command line utility to walk an Amazon S3 hierarchy.
s3find is an analog of find for Amazon S3.
"""
documentation = "https://github.com/AnderEnder/s3find-rs"
homepage = "https://github.com/AnderEnder/s3find-rs"
repository = "https://github.com/AnderEnder/s3find-rs"
keywords = ["find", "aws", "s3", "pattern", "regex"]
categories = ["command-line-utilities"]
license = "BSD-2-Clause"
exclude = [".gitignore", ".github", "codecov.yml"]
edition = "2024"
rust-version = "1.99"

[features]
localstack-tests = []
# Use mimalloc instead of the system allocator. The musl release builds enable
# it: musl's allocator is slow when many threads allocate at once.
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "s3find"
path = "src/bin/s3find.rs"

[badges]
codecov = { repository = "AnderEnder/s3find-rs" }
github-actions = { repository = "AnderEnder/s3find-rs", label = "CI" }

[dependencies]
glob = "0.3"
regex = "1"
anyhow = "1"
thiserror = "2"
futures = "0.3"
async-stream = "0.3"
indicatif = "0.18"
humansize = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
shlex = "2"
urlencoding = "2"
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["net", "sync", "time"] }
aws-smithy-runtime = { version = "1", features = ["test-util"] }
tempfile = "3"
http = "1"
testcontainers = "0.28"
assert_cmd = "2"
predicates = "3"

# build.rs includes src/arg.rs, so this lists exactly what arg.rs uses.
[build-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
glob = "0.3"
regex = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
uninlined_format_args = "warn"

[profile.dev]
debug = false

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
