name: Build

on:
  push:
    branches:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, macos-15-intel, ubuntu-24.04-arm]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
      - name: build
        run: cargo build --verbose
      - name: test
        run: cargo test --lib --no-fail-fast --verbose -- --nocapture
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: Swatinem/rust-cache@v2
      - name: integration tests
        run: cargo test --features localstack-tests --test localstack_integration --no-fail-fast --verbose -- --nocapture
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace

  # The Linux release binaries, built the same way as in release.yml.
  portable-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            zig-target: x86_64-unknown-linux-musl
            args: --features mimalloc
          - target: aarch64-unknown-linux-musl
            zig-target: aarch64-unknown-linux-musl
            args: --features mimalloc
          - target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
          - target: aarch64-unknown-linux-gnu
            zig-target: aarch64-unknown-linux-gnu.2.17
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild
      - name: build
        run: cargo zigbuild --locked --target ${{ matrix.zig-target }} ${{ matrix.args }}
      - name: check linkage
        run: |
          bin=target/${{ matrix.target }}/debug/s3find
          file "$bin"
          case "${{ matrix.target }}" in
            *-musl)
              file "$bin" | grep -Eq "statically linked|static-pie linked"
              ;;
            *-gnu)
              newest=$(readelf -W --dyn-syms "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
              echo "newest glibc symbol version: $newest"
              test "$(printf '%s\n' GLIBC_2.17 "$newest" | sort -V | tail -1)" = GLIBC_2.17
              ;;
          esac
      - name: smoke test
        if: startsWith(matrix.target, 'x86_64')
        run: target/${{ matrix.target }}/debug/s3find --version
