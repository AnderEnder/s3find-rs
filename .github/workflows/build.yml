name: Build

on:
  push:
    branches:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target || matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: windows-latest
          # Intel macOS, cross-compiled on Apple Silicon and tested under
          # Rosetta 2: the Intel runners are several times slower.
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
            cargo-args: --target x86_64-apple-darwin
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target || matrix.os }}
      - name: install Rosetta 2
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: build
        run: cargo build --verbose ${{ matrix.cargo-args }}
      - name: check architecture
        if: matrix.target
        run: |
          bin=target/${{ matrix.target }}/debug/s3find
          lipo -archs "$bin"
          test "$(lipo -archs "$bin")" = "${{ matrix.arch }}"
      - name: test
        run: cargo test --lib --no-fail-fast --verbose ${{ matrix.cargo-args }} -- --nocapture
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: Swatinem/rust-cache@v2
      - name: integration tests
        run: cargo test --features localstack-tests --test localstack_integration --no-fail-fast --verbose -- --nocapture
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace

  # The cross-compiled release binaries, built the same way as in release.yml.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            zig-target: x86_64-unknown-linux-musl
            args: --features mimalloc
          - target: aarch64-unknown-linux-musl
            zig-target: aarch64-unknown-linux-musl
            args: --features mimalloc
          - target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
          - target: aarch64-unknown-linux-gnu
            zig-target: aarch64-unknown-linux-gnu.2.17
          - target: x86_64-unknown-freebsd
            zig-target: x86_64-unknown-freebsd
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild
      - name: build
        run: cargo zigbuild --locked --target ${{ matrix.zig-target }} ${{ matrix.args }}
      - name: check linkage
        run: |
          bin=target/${{ matrix.target }}/debug/s3find
          file "$bin"
          case "${{ matrix.target }}" in
            *-musl)
              file "$bin" | grep -Eq "statically linked|static-pie linked"
              ;;
            *-gnu)
              newest=$(readelf -W --dyn-syms "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
              echo "newest glibc symbol version: $newest"
              test "$(printf '%s\n' GLIBC_2.17 "$newest" | sort -V | tail -1)" = GLIBC_2.17
              ;;
          esac
      - name: smoke test
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: target/${{ matrix.target }}/debug/s3find --version
      - name: upload FreeBSD binary
        if: matrix.target == 'x86_64-unknown-freebsd'
        uses: actions/upload-artifact@v7
        with:
          name: s3find-x86_64-unknown-freebsd
          path: target/x86_64-unknown-freebsd/debug/s3find
          retention-days: 1

  freebsd-smoke-test:
    needs: cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: download FreeBSD binary
        uses: actions/download-artifact@v8
        with:
          name: s3find-x86_64-unknown-freebsd
      - name: run on FreeBSD 14
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          copyback: false
          run: |
            chmod +x s3find
            ./s3find --version
            # Starts the runtime and the SDK, then fails to connect.
            ./s3find s3://bkt --endpoint-url http://127.0.0.1:1 \
              --aws-access-key a --aws-secret-key b --aws-region us-east-1 ls 2>&1 \
              | grep "Connection refused"
