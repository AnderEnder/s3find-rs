name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-crates:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-x86_64
      - name: publish package to crates
        run: |
          cargo package
          cargo publish --token ${{ secrets.CARGO_TOKEN }} || true

  release-cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries run on any Linux, including Alpine and scratch
          # images. musl's allocator is slow under multi-threaded load, so
          # they use mimalloc.
          - target: x86_64-unknown-linux-musl
            zig-target: x86_64-unknown-linux-musl
            args: --features mimalloc
            asset: s3find-x86_64-linux
          - target: aarch64-unknown-linux-musl
            zig-target: aarch64-unknown-linux-musl
            args: --features mimalloc
            asset: s3find-aarch64-linux
          # glibc binaries run on any distribution with glibc 2.17 or newer
          # (RHEL/CentOS 7, Ubuntu 14.04, Debian 8 onwards).
          - target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
            asset: s3find-x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            zig-target: aarch64-unknown-linux-gnu.2.17
            asset: s3find-aarch64-linux-gnu
          # FreeBSD 14 or newer. Its system allocator is already jemalloc.
          - target: x86_64-unknown-freebsd
            zig-target: x86_64-unknown-freebsd
            asset: s3find-x86_64-freebsd
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild
      - name: build release
        run: cargo zigbuild --release --locked --target ${{ matrix.zig-target }} ${{ matrix.args }}
      - name: smoke test
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: target/${{ matrix.target }}/release/s3find --version
      - name: archive
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.asset }}.tar.gz s3find
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-osx:
    runs-on: macOS-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-aarch64
      - name: build release
        run: cargo build --release --verbose
      - name: archive
        run: tar -C target/release -czf $(pwd)/s3find-aarch64-osx.tar.gz s3find
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          files: s3find-aarch64-osx.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-osx-x86_64:
    runs-on: macos-15-intel
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-x86_64
      - name: build release
        run: cargo build --release --verbose
      - name: archive
        run: tar -C target/release -czf $(pwd)/s3find-x86_64-osx.tar.gz s3find
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          files: s3find-x86_64-osx.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64
      - name: build release
        run: cargo build --release --verbose
      - name: archive
        run: tar -C target/release -czf $(pwd)/s3find-x86_64-windows.tar.gz s3find.exe
        shell: bash
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          files: s3find-x86_64-windows.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
